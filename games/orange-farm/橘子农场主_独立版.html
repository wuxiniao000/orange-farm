<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍊 橘子农场主 - Orange Farm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #98FB98 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .cloud {
            position: fixed;
            font-size: 4em;
            opacity: 0.8;
            animation: float 20s infinite linear;
            z-index: 0;
        }
        
        .cloud:nth-child(1) { top: 10%; left: -20%; animation-duration: 25s; }
        .cloud:nth-child(2) { top: 20%; left: -30%; animation-duration: 30s; animation-delay: 5s; }
        .cloud:nth-child(3) { top: 5%; left: -40%; animation-duration: 35s; animation-delay: 10s; }
        
        @keyframes float {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(100vw) translateY(-20px); }
            100% { transform: translateX(200vw) translateY(0); }
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            animation: bounceIn 1s;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .game-title {
            font-size: 3.5em;
            color: #FF8C00;
            text-shadow: 4px 4px 0 #FFD700, 8px 8px 0 rgba(0,0,0,0.2);
            letter-spacing: 3px;
            animation: pulse 2s infinite;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .game-subtitle {
            font-size: 1.3em;
            color: #FF6B35;
            background: rgba(255,255,255,0.9);
            display: inline-block;
            padding: 8px 25px;
            border-radius: 20px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .mascot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 5em;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
            animation: wave 3s infinite;
        }
        
        .mascot:hover {
            transform: scale(1.2) rotate(10deg);
        }
        
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        
        .mascot-bubble {
            position: fixed;
            bottom: 140px;
            right: 80px;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 3px solid #FF8C00;
            font-size: 1em;
            max-width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 99;
            display: none;
            animation: popIn 0.3s;
        }
        
        .mascot-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 30px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #FF8C00 transparent;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .resource-bar {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(255,140,0,0.4);
            border: 4px solid #FFF;
            animation: slideDown 0.5s;
        }
        
        @keyframes slideDown {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .resource-item {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 10px 20px;
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .resource-item::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        .resource-item:hover {
            transform: translateY(-5px) scale(1.05);
        }
        
        .resource-value {
            font-size: 2em;
            color: #FF6B35;
            position: relative;
            z-index: 1;
            font-weight: bold;
        }
        
        .resource-label {
            color: #666;
            font-weight: 600;
            font-size: 0.9em;
            position: relative;
            z-index: 1;
        }
        
        .main-game {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 900px) {
            .main-game {
                grid-template-columns: 1fr;
            }
        }
        
        .farm-section {
            background: linear-gradient(135deg, #DEB887 0%, #D2691E 100%);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 5px solid #8B4513;
            position: relative;
        }
        
        .farm-section::before {
            content: '🌾 农场土地';
            position: absolute;
            top: -15px;
            left: 30px;
            background: #8B4513;
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .plot {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #8B7355 0%, #654321 100%);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 4px solid #5D4E37;
            position: relative;
            overflow: hidden;
        }
        
        .plot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.05) 10px,
                rgba(0,0,0,0.05) 20px
            );
        }
        
        .plot:hover {
            transform: scale(1.05) rotate(2deg);
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255,215,0,0.6);
        }
        
        .plot.ready {
            animation: readyPulse 1s infinite;
        }
        
        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255,215,0,0.4); }
            50% { box-shadow: 0 0 30px rgba(255,215,0,0.8); }
        }
        
        .plot-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .plot-emoji {
            font-size: 3em;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
            transition: all 0.3s;
        }
        
        .plot:hover .plot-emoji {
            transform: scale(1.2);
        }
        
        .plot-info {
            font-size: 0.85em;
            color: white;
            margin-top: 5px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .growth-bar {
            width: 80%;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .growth-fill {
            height: 100%;
            background: linear-gradient(90deg, #90EE90 0%, #32CD32 100%);
            border-radius: 4px;
            transition: width 0.5s;
            position: relative;
        }
        
        .growth-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        .action-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .game-btn {
            flex: 1;
            min-width: 140px;
            padding: 15px 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .game-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s;
        }
        
        .game-btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .game-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .game-btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        .btn-plant {
            background: linear-gradient(135deg, #90EE90 0%, #32CD32 100%);
            color: white;
            border-bottom: 5px solid #228B22;
        }
        
        .btn-fertilizer {
            background: linear-gradient(135deg, #DDA0DD 0%, #BA55D3 100%);
            color: white;
            border-bottom: 5px solid #9370DB;
        }
        
        .btn-sell {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            border-bottom: 5px solid #FF8C00;
        }
        
        .btn-live {
            background: linear-gradient(135deg, #FF6B6B 0%, #EE5A5A 100%);
            color: white;
            border-bottom: 5px solid #DC143C;
        }
        
        .btn-live.active {
            background: linear-gradient(135deg, #4CAF50 0%, #45A049 100%);
            border-bottom: 5px solid #2E7D32;
        }
        
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .live-panel {
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255,105,180,0.4);
            border: 4px solid #FFF;
            position: relative;
            overflow: hidden;
        }
        
        .live-panel::before {
            content: '📹 直播间';
            position: absolute;
            top: -15px;
            left: 30px;
            background: #FF1493;
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .live-screen {
            background: linear-gradient(135deg, #2C2C2C 0%, #1A1A1A 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #FFD700;
            position: relative;
        }
        
        .live-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FF0000;
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8em;
            font-weight: bold;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .live-stats {
            display: flex;
            justify-content: space-around;
            color: white;
            margin-top: 15px;
        }
        
        .live-stat {
            text-align: center;
        }
        
        .live-stat-value {
            font-size: 1.5em;
            color: #FFD700;
            font-weight: bold;
        }
        
        .live-stat-label {
            font-size: 0.85em;
            opacity: 0.9;
        }
        
        .income-animation {
            position: absolute;
            font-size: 1.5em;
            font-weight: bold;
            color: #32CD32;
            animation: floatUp 1s forwards;
            pointer-events: none;
            z-index: 10;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
        
        .shop-panel {
            background: linear-gradient(135deg, #87CEEB 0%, #4682B4 100%);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(135,206,235,0.4);
            border: 4px solid #FFF;
            position: relative;
        }
        
        .shop-panel::before {
            content: '🏪 商店';
            position: absolute;
            top: -15px;
            left: 30px;
            background: #4682B4;
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .shop-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            margin-top: 10px;
        }
        
        .shop-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .shop-tab.active {
            background: white;
            transform: scale(1.05);
        }
        
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .shop-item {
            background: white;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        
        .shop-item:hover {
            border-color: #FFD700;
            transform: scale(1.05);
        }
        
        .shop-item.owned {
            background: #E8F5E9;
            border-color: #4CAF50;
        }
        
        .shop-item-emoji {
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        
        .shop-item-name {
            font-size: 0.85em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .shop-item-price {
            font-size: 0.9em;
            color: #FF6B35;
            font-weight: bold;
        }
        
        .achievements-panel {
            background: linear-gradient(135deg, #DDA0DD 0%, #9370DB 100%);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(221,160,221,0.4);
            border: 4px solid #FFF;
            position: relative;
        }
        
        .achievements-panel::before {
            content: '🏆 成就墙';
            position: absolute;
            top: -15px;
            left: 30px;
            background: #9370DB;
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .achievements-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        
        .achievement {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            border: 3px solid #FFD700;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .achievement:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.7em;
            white-space: nowrap;
            z-index: 10;
        }
        
        .achievement.locked {
            filter: grayscale(100%);
            opacity: 0.4;
            border-color: #999;
        }
        
        .achievement.unlocked {
            animation: unlock 0.5s;
        }
        
        @keyframes unlock {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        
        .log-panel {
            background: linear-gradient(135deg, #F0E68C 0%, #DAA520 100%);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(218,165,32,0.4);
            border: 4px solid #FFF;
            position: relative;
            margin-top: 20px;
        }
        
        .log-panel::before {
            content: '📜 农场日志';
            position: absolute;
            top: -15px;
            left: 30px;
            background: #DAA520;
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .log-container {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 15px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .log-entry {
            padding: 8px 10px;
            border-bottom: 1px dashed #DDD;
            font-size: 0.9em;
            color: #555;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            0% { transform: translateX(-20px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-entry.new {
            background: #FFFACD;
        }
        
        .offline-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            z-index: 1000;
            text-align: center;
            border: 5px solid #FFD700;
            animation: popIn 0.5s forwards;
        }
        
        .offline-popup h2 {
            font-size: 2em;
            color: #FF8C00;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .offline-rewards {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .offline-reward {
            background: linear-gradient(135deg, #FFFACD 0%, #FFD700 100%);
            padding: 20px 30px;
            border-radius: 15px;
            min-width: 120px;
        }
        
        .offline-reward-emoji {
            font-size: 3em;
        }
        
        .offline-reward-value {
            font-size: 1.5em;
            color: #FF6B35;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .close-popup {
            background: linear-gradient(135deg, #FF6B6B 0%, #EE5A5A 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .close-popup:hover {
            transform: scale(1.05);
        }
        
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        
        .level-bar-container {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 15px 20px;
            margin-top: 15px;
        }
        
        .level-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .level-bar {
            height: 15px;
            background: #E0E0E0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .level-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            border-radius: 10px;
            transition: width 0.5s;
            position: relative;
        }
        
        .level-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #FF8C00;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #FF6B35;
        }
        
        .click-effect {
            position: fixed;
            pointer-events: none;
            font-size: 1.5em;
            font-weight: bold;
            animation: clickFloat 1s forwards;
            z-index: 1000;
        }
        
        @keyframes clickFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>
    
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🍊 橘子农场主</h1>
            <div class="game-subtitle">种植 · 直播 · 赚钱 · 装饰</div>
        </div>
        
        <div class="resource-bar">
            <div class="resource-item">
                <div class="resource-value" id="money">¥0</div>
                <div class="resource-label">💰 金钱</div>
            </div>
            <div class="resource-item">
                <div class="resource-value" id="oranges">0</div>
                <div class="resource-label">🍊 橘子</div>
            </div>
            <div class="resource-item">
                <div class="resource-value" id="fans">0</div>
                <div class="resource-label">👥 粉丝</div>
            </div>
            <div class="resource-item">
                <div class="resource-value" id="level">1</div>
                <div class="resource-label">⭐ 等级</div>
            </div>
        </div>
        
        <div class="main-game">
            <div class="farm-section">
                <div class="farm-grid" id="farmGrid"></div>
                
                <div class="action-area">
                    <button class="game-btn btn-plant" onclick="plantOrange()">
                        🌱 种植 <span style="font-size: 0.8em;">(¥10)</span>
                    </button>
                    <button class="game-btn btn-fertilizer" onclick="useFertilizer()">
                        ✨ 肥料 <span style="font-size: 0.8em;">(¥5/个)</span>
                    </button>
                    <button class="game-btn btn-sell" onclick="sellOranges()">
                        🛒 出售 <span style="font-size: 0.8em;">(¥5/个)</span>
                    </button>
                    <button class="game-btn btn-live" id="startLiveBtn" onclick="toggleLive()">
                        🎤 开始直播
                    </button>
                </div>
            </div>
            
            <div class="side-panel">
                <div class="live-panel">
                    <div class="live-screen">
                        <div class="live-badge" id="liveBadge" style="display: none;">LIVE</div>
                        <div style="text-align: center; padding: 20px;">
                            <div style="font-size: 3em; margin-bottom: 10px;" id="liveAvatar">🍊</div>
                            <div style="color: white; font-weight: bold;">橘子农场直播中</div>
                        </div>
                        <div class="live-stats">
                            <div class="live-stat">
                                <div class="live-stat-value" id="viewers">0</div>
                                <div class="live-stat-label">👁️ 观众</div>
                            </div>
                            <div class="live-stat">
                                <div class="live-stat-value" style="color: #32CD32;" id="liveIncome">+¥0/s</div>
                                <div class="live-stat-label">💰 收益</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="level-bar-container">
                    <div class="level-info">
                        <span>⭐ 等级 <span id="levelNum">1</span></span>
                        <span>EXP: <span id="expValue">0</span>/<span id="expNeeded">100</span></span>
                    </div>
                    <div class="level-bar">
                        <div class="level-fill" id="expBar" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="shop-panel">
                    <div class="shop-tabs">
                        <button class="shop-tab active" onclick="switchShopTab('seeds')">🌱 种子</button>
                        <button class="shop-tab" onclick="switchShopTab('decorations')">🏠 装饰</button>
                    </div>
                    <div class="shop-grid" id="shopGrid"></div>
                </div>
                
                <div class="achievements-panel">
                    <div class="achievements-grid" id="achievementsGrid"></div>
                </div>
            </div>
        </div>
        
        <div class="log-panel">
            <div class="log-container" id="logArea">
                <div class="log-entry new">🎉 欢迎来到橘子农场主！开始你的农场之旅吧！</div>
            </div>
        </div>
    </div>
    
    <div class="mascot" onclick="showMascotTip()" id="mascot">🐮🐭</div>
    <div class="mascot-bubble" id="mascotBubble">嘿！点击成熟的橘子收获，开直播赚钱哦！</div>
    
    <div class="popup-overlay" id="popupOverlay" onclick="closeOfflinePopup()"></div>
    <div class="offline-popup" id="offlinePopup">
        <h2>🎉 欢迎回来！</h2>
        <div>在你离开的时间里，农场自动产生了收益：</div>
        <div class="offline-rewards" id="offlineRewards"></div>
        <button class="close-popup" onclick="closeOfflinePopup()">收下奖励</button>
    </div>
    
    <script>
        let gameState = {
            money: 100,
            oranges: 0,
            fans: 10,
            level: 1,
            exp: 0,
            plots: [
                { id: 0, planted: false, growth: 0, maxGrowth: 100, type: 'normal' },
                { id: 1, planted: false, growth: 0, maxGrowth: 100, type: 'normal' },
                { id: 2, planted: false, growth: 0, maxGrowth: 100, type: 'normal' },
                { id: 3, planted: false, growth: 0, maxGrowth: 100, type: 'normal' },
                { id: 4, planted: false, growth: 0, maxGrowth: 100, type: 'normal' },
                { id: 5, planted: false, growth: 0, maxGrowth: 100, type: 'normal' },
            ],
            isLive: false,
            viewers: 0,
            liveIncome: 0,
            decorations: [],
            achievements: [],
            lastSaveTime: Date.now()
        };
        
        const shopItems = {
            seeds: [
                { id: 'golden_seed', name: '金橘种子', emoji: '🌟', price: 50, type: 'seed', growthTime: 80, value: 15 },
                { id: 'honey_seed', name: '蜜橘种子', emoji: '🍯', price: 30, type: 'seed', growthTime: 60, value: 8 },
                { id: 'fertilizer', name: '肥料', emoji: '✨', price: 5, type: 'consumable', effect: 'growth+30' },
            ],
            decorations: [
                { id: 'fence', name: '木栅栏', emoji: '🚧', price: 100, bonus: 'fans+5' },
                { id: 'flowers', name: '鲜花', emoji: '🌸', price: 150, bonus: 'fans+10' },
                { id: 'fountain', name: '喷泉', emoji: '⛲', price: 300, bonus: 'growth+20%' },
                { id: 'lights', name: '直播灯', emoji: '💡', price: 200, bonus: 'income+10%' },
                { id: 'background', name: '精美背景', emoji: '🖼️', price: 250, bonus: 'viewers+20' },
                { id: 'mic', name: '专业麦克风', emoji: '🎙️', price: 400, bonus: 'income+20%' },
            ]
        };
        
        const achievementList = [
            { id: 'first_harvest', name: '第一次收获', emoji: '🍊', condition: (s) => s.oranges >= 1 },
            { id: 'first_sale', name: '第一桶金', emoji: '💰', condition: (s) => s.money >= 100 },
            { id: 'rich', name: '小富翁', emoji: '💎', condition: (s) => s.money >= 500 },
            { id: 'popular', name: '人气主播', emoji: '⭐', condition: (s) => s.fans >= 100 },
            { id: 'full_farm', name: '农场大师', emoji: '🌾', condition: (s) => s.plots.filter(p => p.planted).length >= 6 },
            { id: 'live_master', name: '直播达人', emoji: '📹', condition: (s) => s.viewers >= 50 },
            { id: 'level_5', name: '资深农场主', emoji: '👑', condition: (s) => s.level >= 5 },
            { id: 'level_10', name: '传奇农场主', emoji: '🏆', condition: (s) => s.level >= 10 },
        ];
        
        let fertilizerCount = 2;
        let currentShopTab = 'seeds';
        
        const mascotTips = [
            "嘿！点击成熟的橘子收获，开直播赚钱哦！",
            "记得及时收获，不然橘子会烂掉！",
            "粉丝越多，直播收益越高！",
            "装饰可以让你的农场更漂亮，还能加成收益！",
            "离线也有收益，记得常回来看看！",
            "升级可以解锁更多功能！",
        ];
        
        function init() {
            loadGame();
            renderFarm();
            renderShop();
            renderAchievements();
            updateStats();
            calculateOfflineIncome();
            setInterval(gameLoop, 1000);
            setInterval(saveGame, 10000);
            setInterval(() => {
                if (Math.random() < 0.1) showRandomTip();
            }, 30000);
        }
        
        function gameLoop() {
            let hasChanges = false;
            
            gameState.plots.forEach(plot => {
                if (plot.planted && plot.growth < plot.maxGrowth) {
                    let growthRate = 1;
                    if (gameState.decorations.includes('fountain')) growthRate *= 1.2;
                    plot.growth += growthRate;
                    if (plot.growth >= plot.maxGrowth) {
                        plot.growth = plot.maxGrowth;
                        hasChanges = true;
                    }
                }
            });
            
            if (gameState.isLive) {
                let baseIncome = 2;
                let viewerGrowth = 1;
                if (gameState.decorations.includes('lights')) baseIncome *= 1.1;
                if (gameState.decorations.includes('mic')) baseIncome *= 1.2;
                if (gameState.decorations.includes('background')) viewerGrowth += 0.5;
                baseIncome += gameState.fans * 0.05;
                if (gameState.viewers < 50 + gameState.fans * 0.5) {
                    gameState.viewers += viewerGrowth;
                }
                gameState.liveIncome = baseIncome * (1 + gameState.viewers / 100);
                const income = gameState.liveIncome / 10;
                gameState.money += income;
                if (income > 0.1) showIncomeAnimation(income);
                if (Math.random() < 0.15) {
                    gameState.fans += 1;
                    hasChanges = true;
                }
            } else {
                gameState.viewers = Math.max(0, gameState.viewers - 5);
                gameState.liveIncome = 0;
            }
            
            checkAchievements();
            if (hasChanges || gameState.isLive) {
                updateStats();
                renderFarm();
            }
        }
        
        function plantOrange() {
            const emptyPlot = gameState.plots.find(p => !p.planted);
            if (!emptyPlot) {
                addLog('没有空地了！先收获一些吧 🌱');
                showClickEffect('没有空地了！', event);
                return;
            }
            if (gameState.money < 10) {
                addLog('金钱不足！需要 ¥10 💰');
                showClickEffect('金钱不足！', event);
                return;
            }
            gameState.money -= 10;
            emptyPlot.planted = true;
            emptyPlot.growth = 0;
            emptyPlot.type = 'normal';
            emptyPlot.maxGrowth = 100;
            addLog('种植了一棵橘子树 🌱');
            showClickEffect('-¥10', event);
            updateStats();
            renderFarm();
        }
        
        function useFertilizer() {
            if (fertilizerCount <= 0) {
                addLog('肥料用完了！去商店买吧 ✨');
                showClickEffect('没有肥料了！', event);
                return;
            }
            const maturePlot = gameState.plots.find(p => p.planted && p.growth < p.maxGrowth);
            if (!maturePlot) {
                addLog('没有需要施肥的树 🌱');
                showClickEffect('不需要施肥', event);
                return;
            }
            fertilizerCount--;
            maturePlot.growth += 30;
            if (maturePlot.growth > maturePlot.maxGrowth) {
                maturePlot.growth = maturePlot.maxGrowth;
            }
            addLog('使用了肥料！生长加速 ✨');
            showClickEffect('+30% 生长', event);
            renderFarm();
            updateStats();
        }
        
        function harvestPlot(plotId) {
            const plot = gameState.plots.find(p => p.id === plotId);
            if (!plot || !plot.planted || plot.growth < plot.maxGrowth) return;
            
            let harvestAmount = 1;
            if (plot.type === 'golden') harvestAmount = 2;
            if (plot.type === 'honey') harvestAmount = 2;
            
            gameState.oranges += harvestAmount;
            gameState.exp += harvestAmount * 5;
            plot.planted = false;
            plot.growth = 0;
            
            addLog(`收获了 ${harvestAmount} 个橘子！🍊`);
            showClickEffect(`+${harvestAmount}🍊`, event);
            checkLevelUp();
            updateStats();
            renderFarm();
        }
        
        function sellOranges() {
            if (gameState.oranges <= 0) {
                addLog('没有橘子可卖！先收获吧 🍊');
                showClickEffect('没有橘子', event);
                return;
            }
            const income = gameState.oranges * 5;
            gameState.money += income;
            gameState.exp += gameState.oranges * 2;
            gameState.oranges = 0;
            addLog(`卖出所有橘子！获得 ¥${income} 💰`);
            showClickEffect(`+¥${income}`, event);
            checkLevelUp();
            updateStats();
        }
        
        function toggleLive() {
            gameState.isLive = !gameState.isLive;
            const btn = document.getElementById('startLiveBtn');
            const badge = document.getElementById('liveBadge');
            
            if (gameState.isLive) {
                btn.textContent = '🔴 结束直播';
                btn.classList.add('active');
                badge.style.display = 'block';
                addLog('开始直播啦！欢迎来到直播间 📹');
                showClickEffect('直播开启！', event);
            } else {
                btn.textContent = '🎤 开始直播';
                btn.classList.remove('active');
                badge.style.display = 'none';
                addLog('结束了直播 👋');
            }
        }
        
        function switchShopTab(tab) {
            currentShopTab = tab;
            document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderShop();
        }
        
        function buyItem(itemId, type) {
            let item;
            if (type === 'seeds') {
                item = shopItems.seeds.find(i => i.id === itemId);
            } else {
                item = shopItems.decorations.find(i => i.id === itemId);
            }
            if (!item) return;
            
            if (gameState.money < item.price) {
                addLog('金钱不足！💰');
                showClickEffect('金钱不足！', event);
                return;
            }
            
            if (type === 'seeds') {
                if (item.type === 'seed') {
                    const emptyPlot = gameState.plots.find(p => !p.planted);
                    if (!emptyPlot) {
                        addLog('没有空地了！🌱');
                        showClickEffect('没有空地', event);
                        return;
                    }
                    gameState.money -= item.price;
                    emptyPlot.planted = true;
                    emptyPlot.type = item.id === 'golden_seed' ? 'golden' : 'honey';
                    emptyPlot.maxGrowth = item.growthTime;
                    addLog(`种植了 ${item.name}！🌟`);
                    showClickEffect(`-${item.price}¥`, event);
                    renderFarm();
                } else if (item.type === 'consumable') {
                    gameState.money -= item.price;
                    fertilizerCount++;
                    addLog('购买了肥料！✨');
                    showClickEffect('+1 肥料', event);
                }
            } else {
                if (gameState.decorations.includes(itemId)) {
                    addLog('已经拥有这个装饰了！🏠');
                    return;
                }
                gameState.money -= item.price;
                gameState.decorations.push(itemId);
                addLog(`购买了 ${item.name}！${item.emoji}`);
                showClickEffect(`-${item.price}¥`, event);
                renderShop();
            }
            updateStats();
        }
        
        function checkLevelUp() {
            const expNeeded = gameState.level * 100;
            if (gameState.exp >= expNeeded) {
                gameState.level++;
                gameState.exp = expNeeded;
                addLog(`🎉 升级了！当前等级：${gameState.level}`);
                showClickEffect('升级了！⭐', { clientX: window.innerWidth/2, clientY: window.innerHeight/2 });
            }
        }
        
        function checkAchievements() {
            achievementList.forEach(ach => {
                if (!gameState.achievements.includes(ach.id) && ach.condition(gameState)) {
                    gameState.achievements.push(ach.id);
                    addLog(`🏆 解锁成就：${ach.name}！`);
                    showClickEffect('成就解锁！🏆', { clientX: window.innerWidth/2, clientY: window.innerHeight/2 });
                    renderAchievements();
                }
            });
        }
        
        function updateStats() {
            document.getElementById('money').textContent = '¥' + Math.floor(gameState.money);
            document.getElementById('oranges').textContent = gameState.oranges;
            document.getElementById('fans').textContent = gameState.fans;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('levelNum').textContent = gameState.level;
            document.getElementById('viewers').textContent = Math.floor(gameState.viewers);
            document.getElementById('liveIncome').textContent = '+¥' + gameState.liveIncome.toFixed(1) + '/s';
            
            const expNeeded = gameState.level * 100;
            const expPercent = (gameState.exp / expNeeded) * 100;
            document.getElementById('expValue').textContent = Math.floor(gameState.exp);
            document.getElementById('expNeeded').textContent = expNeeded;
            document.getElementById('expBar').style.width = Math.min(expPercent, 100) + '%';
        }
        
        function renderFarm() {
            const grid = document.getElementById('farmGrid');
            grid.innerHTML = '';
            
            gameState.plots.forEach(plot => {
                const div = document.createElement('div');
                div.className = 'plot';
                if (plot.planted && plot.growth >= plot.maxGrowth) {
                    div.classList.add('ready');
                }
                div.onclick = (e) => { event = e; harvestPlot(plot.id); };
                
                let emoji = '🟫';
                let info = '空地';
                let progress = 0;
                
                if (plot.planted) {
                    progress = (plot.growth / plot.maxGrowth) * 100;
                    if (progress >= 100) {
                        emoji = plot.type === 'golden' ? '🌟🍊' : plot.type === 'honey' ? '🍯🍊' : '🍊';
                        info = '可收获！';
                    } else if (progress >= 50) {
                        emoji = plot.type === 'golden' ? '🌟🌳' : plot.type === 'honey' ? '🍯🌳' : '🌳';
                        info = `成长中 ${Math.floor(progress)}%`;
                    } else {
                        emoji = '🌱';
                        info = `刚种下 ${Math.floor(progress)}%`;
                    }
                }
                
                div.innerHTML = `
                    <div class="plot-content">
                        <div class="plot-emoji">${emoji}</div>
                        <div class="plot-info">${info}</div>
                        ${plot.planted ? `<div class="growth-bar"><div class="growth-fill" style="width: ${progress}%"></div></div>` : ''}
                    </div>
                `;
                grid.appendChild(div);
            });
        }
        
        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const items = currentShopTab === 'seeds' ? shopItems.seeds : shopItems.decorations;
            
            items.forEach(item => {
                const owned = gameState.decorations.includes(item.id);
                const div = document.createElement('div');
                div.className = 'shop-item' + (owned ? ' owned' : '');
                div.onclick = (e) => { event = e; buyItem(item.id, currentShopTab); };
                div.innerHTML = `
                    <div class="shop-item-emoji">${item.emoji}</div>
                    <div class="shop-item-name">${item.name}</div>
                    <div class="shop-item-price">${owned ? '✓ 已拥有' : '¥' + item.price}</div>
                `;
                grid.appendChild(div);
            });
            
            if (currentShopTab === 'seeds') {
                const fertDiv = document.createElement('div');
                fertDiv.className = 'shop-item';
                fertDiv.style.gridColumn = '1 / -1';
                fertDiv.style.background = '#FFFACD';
                fertDiv.innerHTML = `
                    <div class="shop-item-emoji">✨</div>
                    <div class="shop-item-name">现有肥料：${fertilizerCount} 个</div>
                    <div class="shop-item-price">¥5/个</div>
                `;
                grid.appendChild(fertDiv);
            }
        }
        
        function renderAchievements() {
            const grid = document.getElementById('achievementsGrid');
            grid.innerHTML = '';
            
            achievementList.forEach(ach => {
                const unlocked = gameState.achievements.includes(ach.id);
                const div = document.createElement('div');
                div.className = 'achievement' + (unlocked ? ' unlocked' : ' locked');
                div.setAttribute('data-title', ach.name);
                div.textContent = ach.emoji;
                grid.appendChild(div);
            });
            
            if (gameState.achievements.length === 0) {
                grid.innerHTML = '<p style="color: white; text-align: center; width: 100%;">继续努力解锁成就吧！🏆</p>';
            }
        }
        
        function addLog(message) {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = 'log-entry new';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.insertBefore(entry, logArea.firstChild);
            logArea.querySelectorAll('.log-entry').forEach((e, i) => {
                if (i > 0) e.classList.remove('new');
            });
            while (logArea.children.length > 20) {
                logArea.removeChild(logArea.lastChild);
            }
        }
        
        function calculateOfflineIncome() {
            const now = Date.now();
            const lastTime = gameState.lastSaveTime;
            const offlineSeconds = Math.floor((now - lastTime) / 1000);
            
            if (offlineSeconds > 30) {
                const offlineMoney = Math.floor(offlineSeconds * 0.3);
                const offlineOranges = Math.floor(offlineSeconds / 20);
                const offlineFans = Math.floor(offlineSeconds / 60);
                
                if (offlineMoney > 0 || offlineOranges > 0) {
                    gameState.money += offlineMoney;
                    gameState.oranges += offlineOranges;
                    gameState.fans += offlineFans;
                    
                    const rewards = document.getElementById('offlineRewards');
                    rewards.innerHTML = `
                        <div class="offline-reward">
                            <div class="offline-reward-emoji">💰</div>
                            <div class="offline-reward-value">¥${offlineMoney}</div>
                        </div>
                        <div class="offline-reward">
                            <div class="offline-reward-emoji">🍊</div>
                            <div class="offline-reward-value">+${offlineOranges}</div>
                        </div>
                        <div class="offline-reward">
                            <div class="offline-reward-emoji">👥</div>
                            <div class="offline-reward-value">+${offlineFans}</div>
                        </div>
                    `;
                    
                    document.getElementById('popupOverlay').style.display = 'block';
                    document.getElementById('offlinePopup').style.display = 'block';
                    addLog(`离线 ${Math.floor(offlineSeconds/60)} 分钟，获得：¥${offlineMoney} + 🍊${offlineOranges}`);
                }
            }
        }
        
        function closeOfflinePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
            document.getElementById('offlinePopup').style.display = 'none';
        }
        
        function showIncomeAnimation(amount) {
            const livePanel = document.querySelector('.live-panel');
            const anim = document.createElement('div');
            anim.className = 'income-animation';
            anim.textContent = '+¥' + amount.toFixed(1);
            anim.style.left = '50%';
            anim.style.top = '30%';
            livePanel.appendChild(anim);
            setTimeout(() => anim.remove(), 1000);
        }
        
        function showClickEffect(text, e) {
            if (!e || !e.clientX) return;
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.textContent = text;
            effect.style.left = e.clientX + 'px';
            effect.style.top = e.clientY + 'px';
            effect.style.color = text.includes('+') ? '#32CD32' : text.includes('-') ? '#FF6B6B' : '#FFD700';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 1000);
        }
        
        function showMascotTip() {
            const bubble = document.getElementById('mascotBubble');
            bubble.textContent = mascotTips[Math.floor(Math.random() * mascotTips.length)];
            bubble.style.display = 'block';
            setTimeout(() => { bubble.style.display = 'none'; }, 3000);
        }
        
        function showRandomTip() {
            const bubble = document.getElementById('mascotBubble');
            bubble.textContent = mascotTips[Math.floor(Math.random() * mascotTips.length)];
            bubble.style.display = 'block';
            setTimeout(() => { bubble.style.display = 'none'; }, 4000);
        }
        
        function saveGame() {
            gameState.lastSaveTime = Date.now();
            localStorage.setItem('orangeFarmSave', JSON.stringify(gameState));
            localStorage.setItem('fertilizerCount', fertilizerCount);
        }
        
        function loadGame() {
            const save = localStorage.getItem('orangeFarmSave');
            if (save) {
                try {
                    const saved = JSON.parse(save);
                    gameState = { ...gameState, ...saved };
                    fertilizerCount = parseInt(localStorage.getItem('fertilizerCount')) || 2;
                    addLog('欢迎回来！继续你的农场之旅吧 🍊');
                } catch (e) {
                    addLog('存档加载失败，开始新游戏 🌱');
                }
            }
        }
        
        init();
    </script>
</body>
</html>
