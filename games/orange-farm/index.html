<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助农电商模拟器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 顶部状态栏 -->
        <header id="status-bar">
            <div class="status-item">
                <span class="label">💰 现金</span>
                <span id="money" class="value">1000</span>
            </div>
            <div class="status-item">
                <span class="label">🍊 耙耙柑</span>
                <span id="oranges" class="value">0</span>
            </div>
            <div class="status-item">
                <span class="label">📈 繁荣度</span>
                <div id="prosperity-bar">
                    <div id="prosperity-fill"></div>
                </div>
                <span id="prosperity" class="value">0</span>
            </div>
            <div class="status-item">
                <span class="label">📅 第</span>
                <span id="day" class="value">1</span>
                <span class="label">天</span>
            </div>
        </header>

        <!-- 主游戏区域 -->
        <main id="game-main">
            <!-- 左侧：果园 -->
            <section id="orchard-panel" class="panel">
                <h2>🍊 果园</h2>
                <div id="orchard-area">
                    <div id="tree-grid">
                        <!-- 动态生成果树 -->
                    </div>
                </div>
                <div class="action-bar">
                    <button id="btn-harvest" class="btn primary">采摘耙耙柑</button>
                    <button id="btn-plant" class="btn secondary">种植新树 (💰500)</button>
                </div>
                <div class="info-bar">
                    <span>果树数量: <span id="tree-count">1</span></span>
                    <span>库存容量: <span id="storage-cap">100</span></span>
                </div>
            </section>

            <!-- 中间：直播 -->
            <section id="livestream-panel" class="panel">
                <h2>📺 直播带货</h2>
                <div id="livestream-setup">
                    <div class="form-group">
                        <label>选择商品:</label>
                        <select id="product-select">
                            <option value="orange" data-price="10">耙耙柑 (💰10/个)</option>
                            <option value="juice" data-price="25" disabled>果汁 (💰25/瓶) 🔒</option>
                            <option value="dried" data-price="30" disabled>果干 (💰30/包) 🔒</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>定价策略:</label>
                        <select id="price-strategy">
                            <option value="low">低价走量 (+50%销量, -20%价格)</option>
                            <option value="normal" selected>正常定价</option>
                            <option value="high">高端路线 (-30%销量, +50%价格)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>流量投放:</label>
                        <select id="traffic-buy">
                            <option value="0">不投放</option>
                            <option value="100">小量投放 (💰100)</option>
                            <option value="500">中量投放 (💰500)</option>
                            <option value="1000">大量投放 (💰1000)</option>
                        </select>
                    </div>
                </div>
                <button id="btn-stream" class="btn primary large">🎬 开始直播</button>
                <div id="stream-result" class="hidden">
                    <!-- 直播结果显示 -->
                </div>
            </section>

            <!-- 右侧：村庄建设 -->
            <section id="village-panel" class="panel">
                <h2>🏘️ 村庄建设</h2>
                <div id="buildings-list">
                    <!-- 动态生成建筑列表 -->
                </div>
            </section>
        </main>

        <!-- 底部信息栏 -->
        <footer id="info-bar">
            <div id="event-log">
                <p>欢迎来到 <strong>阳光村</strong>！你是新来的大学生村官，带领村民致富吧！</p>
            </div>
        </footer>

        <!-- 直播动画遮罩 -->
        <div id="stream-overlay" class="hidden">
            <div id="stream-animation">
                <div class="streamer-avatar">👩‍💼</div>
                <div class="stream-title">直播中...</div>
                <div class="stream-viewers">👁️ <span id="viewer-count">0</span> 观众</div>
                <div class="stream-orders">📦 <span id="order-count">0</span> 订单</div>
                <div class="progress-bar">
                    <div id="stream-progress"></div>
                </div>
            </div>
        </div>

        <!-- 升官弹窗 -->
        <div id="promotion-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 恭喜升官！</h2>
                <p id="promotion-text"></p>
                <button id="btn-close-promotion" class="btn primary">继续奋斗</button>
            </div>
        </div>

        <!-- 事件弹窗 -->
        <div id="event-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="event-title"></h2>
                <p id="event-text"></p>
                <div id="event-choices"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
